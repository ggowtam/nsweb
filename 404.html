<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>The Ns Creation Films</title>
    <script type="text/javascript">
      // Single-page app routing - preserve query parameters
      var l = window.location;
      var pathSegmentsToKeep = 0;
      var pathname = l.pathname;
      var search = l.search;
      
      // Don't redirect if we're already at root with a redirect parameter
      if (pathname === '/' || pathname === '') {
        // Already at root, let the app handle it
      } else {
        // Extract the page name from the path
        var pageName = pathname.slice(pathname.lastIndexOf('/') + 1).split('/')[pathSegmentsToKeep];
        
        // Build the new URL - preserve existing query params
        if (search) {
          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            '/?redirect=' + pageName + '&' + search.substring(1) + l.hash
          );
        } else {
          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            '/?redirect=' + pageName + l.hash
          );
        }
      }
    </script>
  </head>
  <body>
    <p>If you are not redirected, <a href="/">click here</a>.</p>
  </body>
</html>
