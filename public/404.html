<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>The Ns Creation Films</title>
    <script type="text/javascript">
      // GitHub Pages routing workaround for single-page apps
      // Save the requested path to sessionStorage and redirect to index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?redirect=' +
        l.pathname.slice(l.pathname.lastIndexOf('/') + 1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&query=' + l.search.substring(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>If you are not redirected, <a href="/">click here</a>.</p>
  </body>
</html>
